; hikyuu 2.8.1 原生配置文件（strategy_research 包自包含）
; 依据 docs/wayfinder/research/T2-hikyuu客户端直读数据配置SOP.md 实测模板
; datadir/tmpdir/db 固定指向主仓库包内 strategy_research/data（T3 定稿，绝对路径）
; 关键约束：
;   1. [kdata] dir 必须是纯 ASCII 路径（中文路径静默返回空数据）
;   2. [preload] day = True 必须开启，否则 DATE 型查询返回空
;   3. load_stock_weight = True 必须开启，权息表为空时静默用未复权价（高危）

[hikyuu]
tmpdir = D:\quant\CaiShen\strategy_research\data\tmp
datadir = D:\quant\CaiShen\strategy_research\data
reload_time = 00:00
quotation_server = ipc:///tmp/hikyuu_real.ipc
lazy_preload = False
load_history_finance = False
load_stock_weight = True

[block]
type = sqlite3
db = D:\quant\CaiShen\strategy_research\data\stock.db

[baseinfo]
type = sqlite3
db = D:\quant\CaiShen\strategy_research\data\stock.db

[preload]
day = True
week = False
month = False
quarter = False
halfyear = False
year = False
min = False
min5 = False
min15 = False
min30 = False
min60 = False
hour2 = False
timeline = False
trans = False
day_max = 100000
week_max = 100000
month_max = 100000
quarter_max = 100000
halfyear_max = 100000
year_max = 100000
min_max = 5120
min5_max = 5120
min15_max = 5120
min30_max = 5120
min60_max = 5120
hour2_max = 5120
timeline_max = 5120
trans_max = 5120

[kdata]
type = tdx
dir = D:\TDX\vipdoc
