# ============================================================
# 策略研究系统（strategy_research 包）—— 仅非敏感参数
# 相对路径以本文件（仓库根）为基准；留空则用包内默认
# ============================================================
hikyuu:
  ini_path: strategy_research/hikyuu.ini   # hikyuu 原生配置
  report_dir: strategy_research/reports    # 报告输出目录
  init_cash: 1000000                       # 初始资金（T1 定稿 100 万）
  cost_func: TC_FixedA2017                 # 交易成本函数
  slippage: 0.001                          # 滑点 0.1%（SP_FixedPercent）
